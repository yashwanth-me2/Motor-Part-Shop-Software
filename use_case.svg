<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Use Case Diagram – Motor Part Shop Software (MPSS)</text>

  <!-- system boundary -->
  <rect x="220" y="50" width="600" height="590" fill="#fafafa" stroke="#333" stroke-width="2"/>
  <text x="520" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">MPSS System</text>

  <!-- actor: Shop Owner -->
  <g stroke="#222" stroke-width="2.5" fill="none">
    <circle cx="100" cy="300" r="16" fill="#fff"/>
    <line x1="100" y1="316" x2="100" y2="366"/>
    <line x1="70" y1="334" x2="130" y2="334"/>
    <line x1="100" y1="366" x2="76" y2="402"/>
    <line x1="100" y1="366" x2="124" y2="402"/>
  </g>
  <text x="100" y="428" text-anchor="middle" font-size="15" font-weight="bold">Shop Owner</text>

  <!-- actor: Vendor -->
  <g stroke="#222" stroke-width="2.5" fill="none">
    <circle cx="900" cy="400" r="16" fill="#fff"/>
    <line x1="900" y1="416" x2="900" y2="466"/>
    <line x1="870" y1="434" x2="930" y2="434"/>
    <line x1="900" y1="466" x2="876" y2="502"/>
    <line x1="900" y1="466" x2="924" y2="502"/>
  </g>
  <text x="900" y="528" text-anchor="middle" font-size="15" font-weight="bold">Vendor</text>
  <text x="900" y="546" text-anchor="middle" font-size="12" fill="#555">(receives printed order)</text>

  <!-- association lines owner -> use cases -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="132" y1="334" x2="258" y2="110"/>
    <line x1="132" y1="334" x2="258" y2="180"/>
    <line x1="132" y1="334" x2="258" y2="250"/>
    <line x1="132" y1="334" x2="258" y2="330"/>
    <line x1="132" y1="334" x2="258" y2="410"/>
    <line x1="132" y1="334" x2="258" y2="490"/>
    <line x1="132" y1="334" x2="258" y2="570"/>
    <!-- vendor -->
    <line x1="868" y1="434" x2="522" y2="410"/>
  </g>

  <!-- main use cases -->
  <g fill="#e8f1fb" stroke="#2b5c8a" stroke-width="2">
    <ellipse cx="390" cy="110" rx="132" ry="28"/>
    <ellipse cx="390" cy="180" rx="132" ry="28"/>
    <ellipse cx="390" cy="250" rx="132" ry="28"/>
    <ellipse cx="390" cy="330" rx="132" ry="28"/>
    <ellipse cx="390" cy="410" rx="132" ry="28"/>
    <ellipse cx="390" cy="490" rx="132" ry="28"/>
    <ellipse cx="390" cy="570" rx="132" ry="28"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#111">
    <text x="390" y="115">Manage Vendors</text>
    <text x="390" y="185">Manage Parts (rack no.)</text>
    <text x="390" y="255">Restock Part</text>
    <text x="390" y="335">Record Sale</text>
    <text x="390" y="415">Generate Order List</text>
    <text x="390" y="495">View Daily Revenue</text>
    <text x="390" y="575">View Monthly Sales Graph</text>
  </g>

  <!-- included use cases -->
  <g fill="#fff4e0" stroke="#a0661a" stroke-width="2">
    <ellipse cx="700" cy="290" rx="105" ry="28"/>
    <ellipse cx="700" cy="500" rx="105" ry="36"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#111">
    <text x="700" y="295">Update Stock</text>
    <text x="700" y="496">Calculate Weekly</text>
    <text x="700" y="514">Average &amp; Threshold</text>
  </g>

  <!-- include arrows (dashed) -->
  <g stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" fill="none" marker-end="url(#open)">
    <line x1="515" y1="258" x2="597" y2="281"/>
    <line x1="515" y1="322" x2="597" y2="299"/>
    <line x1="495" y1="432" x2="612" y2="478"/>
  </g>
  <g font-size="12" fill="#444" font-style="italic">
    <text x="528" y="256">«include»</text>
    <text x="528" y="336">«include»</text>
    <text x="572" y="440">«include»</text>
  </g>
</svg>
